name: Rozgar Update Bharat

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  update-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run job updater
        run: python job_updater.py  
